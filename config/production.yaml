USERNAME: "${ADA_USERNAME}"
PASSWORD: "${ADA_PASSWORD}"
HOMESERVER: $ADA_HOMESERVER|https://matrix.org
PREFIX: "${ADA_PREFIX|!}"

env: production
log_level: INFO
database_url: $DATABASE_URL

bot:
  main_room: "!OaOPoyVKqbmPEcMBbt:matrix.org"

extensions:
  welcome:
    room: "!OaOPoyVKqbmPEcMBbt:matrix.org"
  weather:
    api_key: "${ADA_OPENWEATHER_API_KEY|}"

dashboard:
  host: "${DASHBOARD_HOST|0.0.0.0}"
  port: "${DASHBOARD_PORT|1212}"
  event_store: "${DACHSHUND_EVENT_STORE_PATH|dachshund.db}"
