USERNAME: "${ADA_USERNAME}"
PASSWORD: "${ADA_PASSWORD}"
HOMESERVER: $ADA_HOMESERVER|https://matrix.org
PREFIX: "${ADA_PREFIX|!}"

env: development
log_level: DEBUG
database_url: $DATABASE_URL|sqlite:///development.db
sqlalchemy_echo: True

bot:
  main_room: "${ADA_MAIN_ROOM|}"

extensions:
  welcome:
    room: "${ADA_MAIN_ROOM|}"
  weather:
    api_key: "${ADA_OPENWEATHER_API_KEY|}"

dashboard:
  host: "${DASHBOARD_HOST|127.0.0.1}"
  port: "${DASHBOARD_PORT|1212}"
  event_store: "${DACHSHUND_EVENT_STORE_PATH|dachshund.db}"
